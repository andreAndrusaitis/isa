# Leitores de prévia de link (unfurl). Só eles recebem a prévia dinâmica em
# /projetos/...; navegador de gente segue com o SPA. Sem o token genérico "Teams":
# o app desktop do Teams (clássico) tem "Teams/x.y" no user-agent e abre o ISA
# na aba pessoal — pegaria a prévia (com refresh para a mesma URL) em vez do app.
#   SkypeUriPreview  — prévia de links do Teams/Skype
#   MicrosoftPreview — prévia de links do Teams/Outlook/M365 (aka.ms/MicrosoftPreview)
#   msnbot-media / BingPreview — imagens e prévias do Bing usadas pela Microsoft
map $http_user_agent $is_link_preview {
    default 0;
    "~*(SkypeUriPreview|MicrosoftPreview|msnbot-media|BingPreview|Slackbot|facebookexternalhit|Facebot|WhatsApp|TelegramBot|Twitterbot|LinkedInBot|Discordbot)" 1;
}

# Leitor de prévia + caminho de Projetos ($uri já vem normalizado, sem query).
map "$is_link_preview:$uri" $link_preview_route {
    default 0;
    "~^1:/projetos/" 1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # React Router — redireciona tudo para index.html
    # Cache-Control explícito aqui: sem isso, o navegador pode reter o
    # index.html antigo indefinidamente (nginx só manda ETag/Last-Modified,
    # não força revalidação) — como ele referencia os arquivos JS/CSS pelo
    # hash de build, um index.html preso trava o usuário numa versão antiga
    # do app até um hard-refresh manual, mesmo com deploys novos no ar. Os
    # assets com hash (bloco abaixo) continuam cacheáveis por 1 ano sem
    # problema: o hash muda a cada build, então nunca há conflito de cache.
    #
    # frame-ancestors: só o próprio portal e os hosts da Microsoft que abrem
    # a aba pessoal (Teams, Outlook e app Microsoft 365) podem embutir o
    # ISA — qualquer outra origem recebe a página bloqueada (clickjacking).
    # Lista de hosts conforme a doc de CSP das abas do Teams. Fica neste bloco
    # porque é ele que serve o index.html, e o nginx não herda add_header do
    # nível server quando a location declara o seu. Sem X-Frame-Options: ele
    # não aceita lista de origens e bloquearia a aba do Teams.
    #
    # Prévia de link: o if só faz rewrite ... last (uso seguro de if no nginx);
    # sem ele, nada muda para o usuário (mesmos headers e try_files).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' teams.microsoft.com *.teams.microsoft.com *.skype.com *.cloud.microsoft office.com *.office.com *.microsoft365.com outlook.office.com outlook.office365.com outlook.live.com" always;
        try_files $uri $uri/ /index.html;
        # A fase de rewrite roda antes do try_files, qualquer que seja a ordem aqui.
        if ($link_preview_route) {
            rewrite ^ /__link-preview? last;
        }
    }

    # Prévia dinâmica (Open Graph) de tasks/projetos para os leitores do map acima.
    # internal: só se chega aqui pelo rewrite. A URI original vai em X-Original-URI
    # ($request_uri não muda com o rewrite) e o host público em X-Forwarded-Host
    # (o backend só aceita hosts da lista LINK_PREVIEW_ALLOWED_HOSTS). Host aponta
    # para o backend pelo mesmo motivo de /api/ abaixo. Backend fora do ar ou lento:
    # o leitor recebe o index.html normal (tags genéricas), nunca uma página de erro.
    location = /__link-preview {
        internal;
        proxy_pass         http://${BACKEND_HOST}/api/link-preview;
        proxy_set_header   Host ${BACKEND_HOST};
        proxy_set_header   X-Original-URI $request_uri;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Sobrescreve o que o cliente mandar: é este IP que os limites de acesso contam.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
        proxy_intercept_errors on;
        error_page 404 429 500 502 503 504 = @link_preview_fallback;
    }

    # Named location de propósito: o nginx guarda o valor do map durante a requisição,
    # então um redirect interno para /index.html cairia de novo no if de location /.
    # Só leitores de prévia chegam aqui (por isso sem o CSP de frame-ancestors).
    location @link_preview_fallback {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /index.html =404;
    }

    # Imagem da prévia: nome fixo (sem hash de build), então cache curto.
    location = /og-image.png {
        expires 1d;
    }

    # Rotas SSO exigidas pelo Entra ID sem prefixo /api (login/acs/logout)
    # Host aponta para o backend (upstream), não para o domínio do cliente —
    # o Azure App Service do backend valida o Host header e rejeita com 400
    # se receber o hostname do frontend.
    location /auth/ {
        proxy_pass         http://${BACKEND_HOST}/auth/;
        proxy_set_header   Host ${BACKEND_HOST};
        proxy_set_header   X-Real-IP $remote_addr;
        # Sobrescreve o que o cliente mandar: é este IP que os limites de acesso contam.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy da API para o backend — usado especificamente pelo SsoCallbackPage
    # (POST /api/auth/refresh) para que o cookie httpOnly de refresh, setado
    # pelo backend em /auth/acs no domínio do FRONTEND (é aqui que o Azure
    # redireciona de volta), seja enviado de volta nesse mesmo domínio. Uma
    # chamada axios direta ao domínio do backend (VITE_API_URL) é cross-site
    # e nunca recebe esse cookie. O restante do app segue chamando o backend
    # diretamente via VITE_API_URL — este bloco não substitui isso.
    location /api/ {
        proxy_pass         http://${BACKEND_HOST}/api/;
        proxy_set_header   Host ${BACKEND_HOST};
        proxy_set_header   X-Real-IP $remote_addr;
        # Sobrescreve o que o cliente mandar: é este IP que os limites de acesso contam.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Tempo real (chat, avisos e edição simultânea): precisa do upgrade para WebSocket.
    location /socket.io/ {
        proxy_pass         http://${BACKEND_HOST}/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host ${BACKEND_HOST};
        proxy_set_header   X-Real-IP $remote_addr;
        # Sobrescreve o que o cliente mandar: é este IP que os limites de acesso contam.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
