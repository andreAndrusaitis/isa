# Ambiente local completo: banco, API e interface.
#   docker compose up -d      sobe tudo
#   docker compose logs -f    acompanha
#   docker compose down -v    desce e apaga os dados
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: isa_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: isa
      POSTGRES_USER: isa
      POSTGRES_PASSWORD: isa
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isa -d isa"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
    container_name: isa_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://isa:isa@postgres:5432/isa
      DIRECT_URL: postgresql://isa:isa@postgres:5432/isa
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run dev"

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: isa_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3001/api
      VITE_PROXY_TARGET: http://backend:3001
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
    name: isa_postgres_data
