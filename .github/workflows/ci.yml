name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: isa_test
          POSTGRES_USER: isa
          POSTGRES_PASSWORD: isa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isa -d isa_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://isa:isa@localhost:5432/isa_test
      DIRECT_URL: postgresql://isa:isa@localhost:5432/isa_test
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-do-not-use-in-prod-0000000
      JWT_REFRESH_SECRET: ci-test-refresh-secret-do-not-use-000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm test -- --fileParallelism=false

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências de produção (falha só em crítico)
        run: |
          npm audit --omit=dev --audit-level=critical --prefix backend
          npm audit --omit=dev --audit-level=critical --prefix frontend
      - name: Segredos no histórico
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --config .gitleaks.toml .
